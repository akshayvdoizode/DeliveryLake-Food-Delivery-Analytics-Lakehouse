version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: food_delivery_postgres
    restart: always
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_pass
      POSTGRES_DB: food_delivery
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spark-net

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - spark-net

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/spark-data
    networks:
      - spark-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    environment:
      SPARK_WORKER_CORES: 8
      SPARK_WORKER_MEMORY: 8G
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/spark-data
    networks:
      - spark-net

  jupyter:
    build: .
    image: local-pyspark-351:latest
    container_name: jupyter
    depends_on:
      - spark-master
    ports:
      - "8888:8888"
      - "4041:4040"
    environment:
      PYSPARK_MASTER: spark://spark-master:7077
      PYSPARK_PYTHON: python3
    volumes:
      - ./notebooks:/opt/spark-notebooks
      - ./data:/opt/spark-data
      - ./app:/opt/spark-app
    networks:
      - spark-net

volumes:
  postgres-data:
  minio-data:

networks:
  spark-net:
    driver: bridge